pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,mjs,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    - name: gitleaks
      run: gitleaks git --staged --no-banner --redact

commit-msg:
  jobs:
    - name: conventional-commits
      run: |
        head -1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
          || { echo "Commit subject must follow Conventional Commits (e.g. 'feat: add dictionary')"; exit 1; }
